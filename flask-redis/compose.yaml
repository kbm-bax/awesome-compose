services:
  redis-auth:
    image: redislabs/redismod
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        umask 077
        if [ ! -s /run/redis-auth/password ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/redis-auth/password
        fi
        printf 'requirepass %s\n' "$$(cat /run/redis-auth/password)" > /run/redis-auth/redis.conf
    volumes:
      - redis-auth:/run/redis-auth
  redis:
    image: redislabs/redismod
    command:
      - /run/redis-auth/redis.conf
      - --loadmodule
      - /usr/lib/redis/modules/redisai.so
      - --loadmodule
      - /usr/lib/redis/modules/redisearch.so
      - --loadmodule
      - /usr/lib/redis/modules/redisgraph.so
      - --loadmodule
      - /usr/lib/redis/modules/redistimeseries.so
      - --loadmodule
      - /usr/lib/redis/modules/rejson.so
      - --loadmodule
      - /usr/lib/redis/modules/redisbloom.so
      - --loadmodule
      - /usr/lib/redis/modules/redisgears.so
      - Plugin
      - /var/opt/redislabs/modules/rg/plugin/gears_python.so
    volumes:
      - redis-auth:/run/redis-auth:ro
    depends_on:
      redis-auth:
        condition: service_completed_successfully
  web:
    build:
      context: .
      target: builder
    # flask requires SIGINT to stop gracefully
    # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    ports:
      - '8000:8000'
    environment:
      - REDIS_PASSWORD_FILE=/run/redis-auth/password
    volumes:
      - .:/code
      - redis-auth:/run/redis-auth:ro
    depends_on:
      redis-auth:
        condition: service_completed_successfully
      redis:
        condition: service_started
volumes:
  redis-auth:

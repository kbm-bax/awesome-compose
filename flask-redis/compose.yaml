services:
  redis:
    image: redis:7.4
    networks:
      - backend
  web:
    build:
      context: .
      target: builder
    # flask requires SIGINT to stop gracefully
    # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    ports:
      - '8000:8000'
    volumes:
      - .:/code
    networks:
      - frontend
      - backend
    depends_on:
      - redis
networks:
  frontend:
  backend:
    internal: true

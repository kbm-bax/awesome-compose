server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # The backend checks the Authorization header on every order route, so
    # nginx only forwards it and must never add a credential of its own.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }
}
